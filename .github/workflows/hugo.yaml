name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# 一次只跑一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

# 用内容写权限：推 gh-pages 分支即可，不依赖 Pages API
permissions:
  contents: write

# Hugo 站点在 blog/ 子目录里
defaults:
  run:
    working-directory: blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---- 1. 检出源码（含子模块 = hugo 主题）----
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---- 2. 装最新 Hugo extended ----
      # 主题用新版模板函数 hash.FNV32a，需较新 Hugo；latest 自动解决
      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # ---- 3. 构建（working-directory 已是 blog/）----
      - name: Build
        run: hugo --minify

      # ---- 4. 部署到 gh-pages 分支 ----
      # 经典方案，GITHUB_TOKEN 即可，无需额外 PAT / Pages API
      # 第一次 push 后，去 Settings → Pages → Source 选 Deploy from a branch: gh-pages
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          full_commit_message: 'Auto-deployed by GitHub Actions\nCommit: ${{ github.sha }}\nMessage: ${{ github.event.head_commit.message }}'