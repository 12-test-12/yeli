name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: read
    outputs:
      release_requested: ${{ steps.notes.outputs.release_requested }}
      has_articles: ${{ steps.notes.outputs.has_articles }}
      release_notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: npm ci

      - name: Check release notes generator
        run: node --test scripts/release-notes.test.mjs

      - name: Build Quartz
        run: npm run quartz -- build

      - name: Prepare release notes from published articles
        id: notes
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/release-notes.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [build, deploy]
    if: needs.build.outputs.release_requested == 'true' && needs.build.outputs.has_articles == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes file
        env:
          RELEASE_NOTES: ${{ needs.build.outputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release for the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "📝 内容更新 — $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
