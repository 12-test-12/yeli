# =============================================================
# Hugo 站点主配置
# 个人 IP 风格 / 深色全屏极客风 / 基于 Stack 主题魔改
# =============================================================

baseURL: "https://12-test-12.github.io/yeli/"
title: "YeLi's Blog"
theme: hugo-theme-stack

# 站点默认语言 (zh-cn)，Stack 主题自带 i18n
defaultContentLanguage: zh-cn
hasCJKLanguage: true
defaultContentLanguageInSubdir: false

pagination:
  pagerSize: 10

# 主题参数
params:
  # ===== 基础信息 =====
  description: "代码 · 折腾 · 记录"
  keywords:
    - 博客
    - 个人 IP
    - 技术笔记
    - 项目记录
  author: "YeLi"
  images:
    - /img/avatar.svg

  mainSections:
    - posts
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.svg

  # ===== footer =====
  footer:
    since: 2026
    customText:

  # ===== 日期格式 =====
  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02 15:04 MST"

  # ===== 侧边栏（CSS 隐藏了侧栏，但模板仍需要这些参数避免报错）=====
  sidebar:
    compact: true
    emoji:
    subtitle: "代码 · 折腾 · 记录"
    avatar:
      enabled: false
      local: true
      src: img/avatar.png

  # ===== 文章设置 =====
  article:
    headingAnchor: false
    math: false
    toc: true
    readingTime: true
    license:
      enabled: false
      default: "Licensed under CC BY-NC-SA 4.0"

  # ===== 评论 =====
  comments:
    enabled: false
    provider: disqus

  # ===== Widgets（必须用对象格式，不能是字符串）=====
  # 可用 widget: search, archives, categories, tag-cloud, toc
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
    page:
      - type: toc

  # ===== OpenGraph =====
  opengraph:
    twitter:
      site:
      card: summary_large_image

  # ===== 默认图片 =====
  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:

  # ===== 颜色方案：强制深色 =====
  colorScheme:
    toggle: false
    default: dark

  # ===== 图片处理 =====
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

# =============================================================
# 输出格式
# =============================================================
outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS

# =============================================================
# 菜单
# =============================================================
menu:
  main:
    - identifier: home
      name: 首页
      pageRef: /
      weight: 1
    - identifier: notes
      name: 笔记
      pageRef: /posts/
      weight: 2
    - identifier: projects
      name: 项目
      pageRef: /categories/project/
      weight: 3
    - identifier: about
      name: 关于
      pageRef: /about/
      weight: 4

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/12-test-12
      params:
        icon: brand-github
    - identifier: rss
      name: RSS
      url: /yeli/index.xml
      params:
        icon: rss

# =============================================================
# Permalinks
# =============================================================
permalinks:
  posts: /posts/:slug/
  page: /:slug/
  tags: /tags/:slug/
  categories: /categories/:slug/

# =============================================================
# Markdown 设置
# =============================================================
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
    tabWidth: 4
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  figure:
    enable: true

# =============================================================
# Taxonomies
# =============================================================
taxonomies:
  category: categories
  tag: tags
  series: series

# =============================================================
# Related content
# =============================================================
related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200
