name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 一次只跑一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

# 注意：这里用 contents: write 而不是 pages: write
# 因为我们走的是"推 gh-pages 分支"的传统方案，不需要 Pages deployment API
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---- 1. 检出源码（含子模块 = hugo 主题）----
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 关键：递归拉取 themes/hugo-theme-stack
          fetch-depth: 0

      # ---- 2. 装最新 Hugo extended ----
      # Stack 主题用 SCSS，必须 extended；
      # 最新版含 hash.FNV32a 等新函数，避免 v0.124 报 "function hash not defined"
      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # ---- 3. 构建 ----
      # 用 hugo.yaml 里写好的 baseURL（你部署前需要把它改成真实地址）
      - name: Build
        run: hugo --minify

      # ---- 4. 部署到 gh-pages 分支 ----
      # 用 GITHUB_TOKEN，不需要额外 PAT
      # 第一次 push 后，去 GitHub Settings → Pages 选 "Deploy from a branch: gh-pages"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # 慢：push 到 gh-pages 分支后，GitHub 会自动识别并发布
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          full_commit_message: 'Auto-deployed by GitHub Actions\nCommit: ${{ github.sha }}\nMessage: ${{ github.event.head_commit.message }}'
