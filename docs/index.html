<script type="text/markdown" id="article-kmp-structure">
## KMP 是什么

Kotlin Multiplatform，JetBrains 出的跨平台方案，核心思想：
**业务逻辑写一次，UI 各端分别实现。**

## 项目结构

```
myapp/
├── commonMain/        # 跨端共享代码（业务、领域模型、网络）
│   └── kotlin/
│       ├── data/
│       ├── domain/
│       └── network/
├── androidMain/       # Android 特有（Activity 入口、Android API 封装）
├── iosMain/           # iOS 特有（UIKit 桥接、NSURLSession 封装）
└── desktopMain/       # Desktop 特有
```

## 一个最简单的示例

`commonMain` 里：

```kotlin
// 平台无关的领域模型
data class User(val id: String, val name: String)

// 平台无关的业务逻辑
class UserRepository {
    fun getUser(id: String): User = User(id, "YeLi")
}
```

`androidMain` 里调用：

```kotlin
class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val repo = UserRepository()
        println(repo.getUser("1").name)
    }
}
```

## 关键原则

- `commonMain` 里 **不能** 直接调用任何平台 API
- 用 `expect` / `actual` 桥接平台差异：

```kotlin
// commonMain
expect fun platformName(): String

// androidMain
actual fun platformName(): String = "Android"

// iosMain
actual fun platformName(): String = "iOS"
```

## 我目前的看法

- KMP 适合 **业务逻辑重、UI 不复杂** 的应用
- UI 想要跨端，得等 **Compose Multiplatform** 进一步成熟
- 已经做 Android 的话，KMP 学习曲线很友好

## TODO

- [ ] 接入网络请求 (Ktor)
- [ ] 跑一次 iOS 真机

<script type="text/markdown" id="article-spring-jpa-field-mapping">
## 背景

数据库里有个表，字段名是 `user_id`、`created_at` 这种 snake_case。
我对应的 Entity 属性名按习惯写成了 `userId`、`createdAt`，运行时报错：

```
Column "user_id" not found.
```

## 排查

JPA 规范里，默认的命名策略（ImplicitNamingStrategy）会按以下顺序匹配：

1. 显式 `@Column(name = "user_id")` 优先
2. 属性名 `userId` → 物理列 `userid`（小写拼接）  
   而不是期待的 `user_id`
3. 所以 `user_id` 找不到

## 解决

**方式 A：显式标注（推荐）**

```java
@Column(name = "user_id")
private Long userId;
```

**方式 B：全局开启命名策略**

```yaml
spring:
  jpa:
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
```

开启后，`userId` 会被自动转成 `user_id`，**但只有在 Hibernate 6+ 才有**。

## 收获

- JPA 字段映射看的是 **物理列名**，不是 Entity 字段名
- 小项目用 `@Column` 显式标最稳
- 大项目统一用 `SpringPhysicalNamingStrategy`，省心

---

> 看到不对的字段映射时，先看数据库的列名，
> 再看 Entity 上的 `@Column`，最后看全局策略。
</script>

<script type="text/markdown" id="article-github-actions-hugo-deploy">
## 背景

把 Hugo 博客部署到 GitHub Pages，懒得每次手动 build + push。
上 GitHub Actions 自动跑。

## 过程

### Step 1：写 workflow

```yaml
name: Deploy Hugo to Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - run: hugo --minify
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
```

### Step 2：第一次 push，挂了 ❌

报错：
```
Error: Error building site: TOCSS: failed to transform "scss/style.scss"
```

**原因**：Stack 主题用了 SCSS，必须装 **extended** 版 Hugo。
我虽然写了 `extended: true`，但 action 默认下载的是非 extended。

### Step 3：指定 hugo 版本 + 显式 extended

```yaml
- uses: peaceiris/actions-hugo@v3
  with:
    hugo-version: '0.124.1'
    extended: true
```

再跑，又挂 ❌：
```
fatal: could not read Username for 'https://github.com'
```

**原因**：默认 push 到当前 repo 的 `gh-pages` 分支需要权限。
但是 `GITHUB_TOKEN` 在默认设置下是只读的。

### Step 4：加 workflow 权限

Settings → Actions → General → Workflow permissions →  
✅ **Read and write permissions**

再跑，成功 ✅！

## 遇到的问题

### 问题 1：CSS 编译失败

**现象**：TOCSS 错误  
**原因**：Hugo 非 extended 版  
**解决**：用 `peaceiris/actions-hugo` + `extended: true`

### 问题 2：push 到 gh-pages 没权限

**现象**：`could not read Username`  
**原因**：`GITHUB_TOKEN` 默认只读  
**解决**：仓库设置里开 write 权限

### 问题 3：自定义域名

如果要 `你的域名.com`：
1. `static/CNAME` 写一行 `你的域名.com`
2. DNS 加 CNAME 指向 `12-test-12.github.io.`

## 收获

- **CI 调试要看完整日志**，别只看最后一行
- Hugo 主题的 SCSS / TS 一定要 **extended** 版
- GitHub Actions 的 token 权限是 **容易踩的坑**

## 最终的 workflow

放仓库 `.github/workflows/hugo.yaml`，每次 push main 自动部署。

## 基本概念

狩猎之前，要了解地形，首先要了解两个经常被视为同义词但实际上**并非如此的**词：

- **信息安全（InfoSec）保护**任何形式的信息：数字信息、纸质信息、对话信息，甚至是锁在抽屉里的合同。这是一个涵盖范围最广的概念；其支柱（如下所示的CIA三要素）既适用于服务器，_也_适用于纸质文档。
- **网络安全**专注于**数字世界**：保护系统、网络、设备和电子数据免受网络威胁。实际上，它是信息安全的一个**分支**（两者有相当大的重叠，但并不相同）。

### 分队

- **防御型（蓝队）：**该团队负责保护、监控、检测、响应和纠正安全漏洞。**蓝队**负责这条防线（安全运营中心、事件响应、_安全加固_）。
- **进攻方（红队）：**指那些在获得授权的情况下，**以攻击为目的**，在攻击者之前发现漏洞的人员。**漏洞赏金计划就属于这一范畴。这**并非单一角色：进攻方涵盖**渗透测试**、**漏洞赏金/漏洞挖掘**以及**红队**本身，红队是一门特定的学科（见下表），并非与"进攻"一词同义。
- **应用安全**涵盖两个方面：**防御**方面（编写安全代码、_威胁建模_、代码审查）和**攻击方面**（测试应用程序漏洞）。漏洞赏金计划在很大程度上属于**攻击性应用安全范畴**。
- **紫队**：红蓝融合。它可以是一个专门负责红蓝作战的团队，也可以是一种**攻防协作的循环工作/演练方法**：攻击者展示攻击_手段_，防御者调整检测和响应策略，双方共同验证修正是否有效。名称源于红蓝组合（红色+蓝色=紫色）。重点并非"另一支队伍发起攻击"，而是**攻防之间的反馈循环**。

# 网络工作原理

网络工作分为三个：客户端，服务端，数据库

- **客户端** ：对于用户使用的，在您的计算机上运行 HTML、CSS 和 JavaScript 。这里的一切都由 您控制，因此**任何仅在客户端进行的安全检查都毫无意义**。隐藏按钮、字段`disabled`、JS 验证：所有这些都可以绕过。
- **服务端**：接收请求，应用**业务逻辑，决定谁可以访问什么资源**，并做出响应。真正的安全机制就存在于此（或者说应该存在于此）。
- **数据库**：用于存储数据（用户、订单、发票等）。服务器查询数据库；客户端**永远不会**直接与数据库交互。==这个就是咱们的最终目标==

欧克，先了解一下最基本的东西，之后看他们是怎么来进行连接的？

    客户端和服务器之间的通信通过**HTTP**（或 HTTPS，即在加密的 TLS 隧道内进行的 HTTP 通信）进行。理解 HTTP 是至关重要的起点：从现在开始，你将使用这种语言进行交流。

## HTTP结构

HTTP 是一种**请求-响应**协议：客户端发送_请求_，服务器发送_响应_。每次交换都是独立的。该协议是**无状态的**（它本身不记住之前的请求；我们稍后会看到 cookie 如何解决这个问题）。

举个例子，先讲一下怎么理解http内容

```http
GET /api/perfil?id=1001 HTTP/2
Host: app.exemplo.com
User-Agent: Mozilla/5.0
Accept: application/json
Cookie: session=abc123
Authorization: Bearer eyJhbGciOiJIUzI1NiJ9...
```

分析如下：

- GET /api/perfil?id=1001 HTTP/2 ，表示用的是GET的请求方法，访问了/api/perfil?id=1001这个路径
- 标头：也就是剩下的部分，他表示了这个请求涵盖的一些信息，例如：HOST：主机名，User-Agent：用户的设备（浏览器）信息，cookie：**代表了用户的个人的凭证**（这个也是之后在工作过程中及其重要的一点）
- 正文：剩下的没有体现出来就是，他一般会出现在post或者put传参中

## HTTP方法

| 序号  | 方法      | 描述                                                                             |
| --- | ------- | ------------------------------------------------------------------------------ |
| 1   | GET     | 从服务器获取资源。用于请求数据而不对数据进行更改。例如，从服务器获取网页、图片等。                                      |
| 2   | POST    | 向服务器发送数据以创建新资源。常用于提交表单数据或上传文件。发送的数据包含在请求体中。                                    |
| 3   | PUT     | 向服务器发送数据以更新现有资源。如果资源不存在，则创建新的资源。与 POST 不同，PUT 通常是幂等的，即多次执行相同的 PUT 请求不会产生不同的结果。 |
| 4   | DELETE  | 从服务器删除指定的资源。请求中包含要删除的资源标识符。                                                    |
| 5   | PATCH   | 对资源进行部分修改。与 PUT 类似，但 PATCH 只更改部分数据而不是替换整个资源。                                   |
| 6   | HEAD    | 类似于 GET，但服务器只返回响应的头部，不返回实际数据。用于检查资源的元数据（例如，检查资源是否存在，查看响应的头部信息）。                |
| 7   | OPTIONS | 返回服务器支持的 HTTP 方法。用于检查服务器支持哪些请求方法，通常用于跨域资源共享（CORS）的预检请求。                        |
| 8   | TRACE   | 回显服务器收到的请求，主要用于诊断。客户端可以查看请求在服务器中的处理路径。                                         |
| 9   | CONNECT | 建立一个到服务器的隧道，通常用于 HTTPS 连接。客户端可以通过该隧道发送加密的数据。                                   |

|5**|服务器错误，服务器在处理请求的过程中发生了错误|

你经常阅读并检验的那些：

- **200** OK成功了。如果你交换数据`id`后收到了`200`不属于你的数据，警告灯应该会亮起。
- **401** Unauthorized尽管名称如此，但它的意思是**"未经认证**"，也就是说您需要先进行身份验证（登录）。
- **403** Forbidden您已登录，但没有此功能的权限**401**。（请记住x 的差值`403`；这对下一节至关重要。）
- **404** Not Found该资源不存在。有时，API 会故意返回 `true``404`而不是`403``false`，以避免泄露对象存在的事实。
- **405** Method Not Allowed这种方法虽然为人所知，但那里并不接受。提示：切换`GET`↔ `POST`
- **429** Too Many Requests速率限制。在敏感流程（登录、一次性密码）中缺少速率限制本身就是一个需要上报的故障。
- **500** Internal Server Error服务器崩溃了。意外错误通常会泄露堆栈跟踪和数据，这很可能表明你输入了服务器没有预料到的数据。

# cookie和session

- **cookie** ：作用于客户端来确定用户的身份
- **session**：作用于服务端来确定用户的身份

## 区别

session和cookie本质上确实是两个东西，但cookie同时也是session id的载体，cookie保存session id。

cookie数据存放在用户的浏览器上，session数据放在网站的服务器上。  
session保存在服务器端与浏览器设置无关，cookie在客户端并受浏览器设置限制。  
cookie是在你的电脑浏览器上保存的,session是在网站服务器上的. 也就是说你换一个电脑你的cookie就不起作用了, 而session只要你的浏览器不关就还能访问到.  
通常的都是两者结合着用的. cookie的话你自己就可以通过对浏览器的设置禁用掉.这样就不起作用了

cookie不是很安全，别人可以分析存放在本地的cookie并进行cookie欺骗，考虑到安全应当使用session。  
session是服务器端缓存，cookie是客户端缓存。  
cookie机制采用的是在客户端保持状态的方案，而session机制采用的是在服务器端保持状态的方案

session会在一定时间内保存在服务器上。当访问增多，会比较占用你服务器的性能，考虑到减轻服务器性能方面，应当使用cookie。  
session是服务器保持客户端状态信息的方案，一般是保存在服务器中的一块内存中，session超时时间在服务器端进行设置。  
cookie是客户端保持用户信息的方案，一般是文件形式保存，cookie清空时间是在客户端浏览器设置。  
从开发角度说，session信息可以通过技术方案写到客户端保存，cookie中的用户信息，也可以在用户访问该网站时，通过技术手段自动更新用户的session信息。

单个cookie保存的数据不能超过4K，很多浏览器都限制一个站点最多保存20个cookie。

建议：将登陆信息等重要信息存放为session；其他信息如果需要保留，可以放在cookie中


举个例子
```http
# 1) # 你登录——服务器创建会话并返回"手环"（令牌）
POST /login HTTP/2
Host: app.exemplo.com
Content-Type: application/json

{"usuario":"alice","senha":"..."}
```

```http
# 服务器返回一个cookie给你
HTTP/2 200 OK
Set-Cookie: session=abc123; HttpOnly; Secure; SameSite=Lax   
```

```http
# 2) 在后续的请求中，浏览器会自动重新发送 cookie。
GET /api/perfil HTTP/2
Host: app.exemplo.com
Cookie: session=abc123   
```

你需要识别的三种 Cookie 标志（它们将在后面的多篇文章中出现）：

- **HttpOnly**页面的 JavaScript**无法读取 cookie。这可以缓解通过 XSS 攻击进行的会话劫持。
- **Secure cookie** 只能通过 HTTPS 传输。
- **SameSite**这控制着 cookie 是否会随来自**其他网站的请求一起发送。它是抵御****CSRF**攻击的第一道防线。

# What  a web 漏洞

简单来说就是一个程序他没有按照预期的来进行，导致一些原本不应该被看到的东西被看到，这个就是一个最基本的web漏洞，他基本上都是这个样子的

> [!example] 例子
> 简单来说就是你去开别人的保险库，但是你不知道保险库的密码是多少，但是你试了一个111111的时候，保险库打开了，这个就是一个web漏洞，你不是保险库的拥有者，但是你将里面的东西给试了出来，你看到了保险库里面的东西，这个就是一个错误！

出现web漏洞的错误一般就是服务端那边认可了客户端这边的输入，这个一般会是一个灾难的开始，所有离开浏览器的内容都由用户控制，而将这些信息视为可信信息正是 IDOR、注入攻击、授权绕过以及本系列文章中几乎所有问题的根源。

# 身份验证与授权

这个是一切的基石，需要弄懂这个，后面的很多的东西就会融汇贯通了

另外这两个词有一个天然之间的一个区别，一个是**服务端**认可了你的身份，认为你是一个**合法用户**，另外一个是服务端那边需要确定你这个身份是否可以实行这个权力

> [!example] 例子
> 将服务端比作学校的话，你现在捡了一个学生的学生证，刚好保安没有仔细看，让你过去了，这个就是服务端认可了你的身份。这个时候，你是一个学生，你可以行驶的权利并不是很多，但是如果你是该校的校长的话，那就不一般了。
> 学生和校长可以行驶的权利本来就是不对等的，保安认可了你学生的身份，但是不认可你拥有和校长一样的权利，因此授权很重要，不然就会出现一个学生开除一个学生的荒诞的笑话

![[Pasted image 20260826100027.png]]

用代码解释一下

``` js
// 有漏洞的版本 — 验证了你已登录，但没有验证这个请求是你的
function getPedido() {
    if (!usuarioEstaLogado()) {           // 认证：OK
        http_response_code(401);
        return;
    }
    $id = $_GET['id'];                     // <- 信任了客户端传来的 id
    return Pedido::find($id);              // 任何登录用户都能拿到
}

// 正确的版本 — 同时验证所有权（授权）
function getPedido() {
    if (!usuarioEstaLogado()) {
        http_response_code(401);
        return;
    }
    $pedido = Pedido::where('id', $_GET['id'])
                    ->where('dono_id', usuarioLogadoId())  // <- 缺失的检查
                    ->first();
    if (!$pedido) { http_response_code(403); return; }     // 已登录，但不是你的
    return $pedido;
}
```

在上述的代码中，在有问题的那一块会出现一个问题就是**usuarioEstaLogado()** 这个函数只做了这一步，他没有进行下一步的任何的验证操作，直接信任了客户端传输过来的任何的信息，与之相反，的二个给出来的东西，他**usuarioLogadoId()** 这个函数确认了一下客户端发送的id是不是你的，如果不是你的，就会返回403，也就是服务端不认可你的身份。

**作者的忠告：** 你登录不能认为你拥有了一切，身份验证并不等于授权，这个是开发过程中可能会出现的一个问题，但是如果开发懒了一下的话，就是咱们的机会。([[IDOR、BOLA 和 BFLA 的基础到高级应用]])

# OWASP Top 10路线图

OWASP Top 10 是 Web 应用程序中最关键风险类别的列表，由 Open Worldwide Application Security Project（开放式全球应用程序安全项目）维护。它就像是这个领域的地图，值得牢记，因为漏洞赏金计划、分类人员和严重性评级都使用这套语言。

最新版本是 2025 版，但在本文中我们特意按照 [2021 版](https://owasp.org/Top10/2021/)来学习。2021 版至今仍是绝大多数漏洞赏金计划、分类人员和学习材料所使用的参考标准；其中的类别更稳定，也更有助于教学入门。当你掌握了 2021 版后，过渡到 2025 版只需要做一些调整（见表格后面的说明）。以下是 2021 版：

|#|类别|一句话说明|
|---|---|---|
|A01|Broken Access Control（访问控制失效）|访问他人的数据/功能（IDOR、BOLA、BFLA）—— 这是回报最高的类别|
|A02|Cryptographic Failures（加密机制失效）|敏感数据保护不足（缺少 TLS、弱哈希、密钥泄露）|
|A03|Injection（注入）|输入被当作代码/命令执行（SQLi、NoSQLi、命令注入、XSS）|
|A04|Insecure Design（不安全设计）|架构/逻辑缺陷 —— 设计从一开始就是错的|
|A05|Security Misconfiguration（安全配置错误）|配置不当（默认配置、开放面板、缺少响应头）|
|A06|Vulnerable and Outdated Components（易受攻击和过时的组件）|使用带有已知 CVE 的过时库/服务|
|A07|Identification and Authentication Failures（身份识别与认证失败）|登录环节的缺陷（弱密码、会话管理不善、MFA 存在漏洞）|
|A08|Software and Data Integrity Failures（软件与数据完整性失效）|信任未校验完整性的更新/流水线/数据（例如：不安全的反序列化）|
|A09|Security Logging and Monitoring Failures（安全日志记录与监控失效）|没有日志记录/监控 —— 攻击发生了却无人察觉|
|A10|Server-Side Request Forgery（服务器端请求伪造，SSRF）|迫使服务器向你指定的目标发起请求（内网、云元数据）|

不需要一开始就全部背下来。先掌握 A01 和 A03（它们出现频率最高、回报也最高），然后把这份列表当作索引来学习其余部分。

> [!node] 重大消息
>  那么 [OWASP Top 10 2025](https://owasp.org/Top10/2025/) 呢？新版本已经发布并重新调整了列表。值得了解的变化有：Broken Access Control 仍居第 1 位；Security Misconfiguration 上升到第 2 位；Injection 降至第 5 位，Insecure Design 降至第 6 位；Vulnerable and Outdated Components 变成了 Software Supply Chain Failures（第 3 位，范围更广）；SSRF 不再是独立类别，被并入了 Broken Access Control；还新增了一个类别：Mishandling of Exceptional Conditions（第 10 位）。核心思路不变，只是名称和位置有所调整。先学 2021 版（项目仍在使用的版本），然后把 2025 版当作"差异对比"来阅读。

## 赏金计划

> [!node] 什么是赏金计划
>  **漏洞赏金**计划是指公司**授权**外部研究人员查找其系统中的漏洞，并对负责任地报告的有效漏洞**支付奖励**（赏金）。

也就是常说的一些单子，但是，一定不要去接**犯法的单子**，当然你要是快饿死了，那就自己考虑了

当你接赏金计划的时候，有一下前提需要注意
- **只触碰授权范围内的内容。未经授权替换`id`他人系统中的任何内容都属于非法入侵，将受到法律制裁（在巴西，参见《刑法典》第154-A条）。
- **最小概念验证。以尽可能****小**的影响展示缺陷。无需下载整个个人身份信息 (PII) 数据库来"证明"缺陷：一两条经过脱敏处理的记录就足够了。
- **不得造成损害。禁止中断服务、删除生产数据或使用第三方真实账户。
- **负责任地进行举报。首先保护隐私，仅在获得许可的情况下才予以披露。

# 术语表

在接下来的文章中，你会经常遇到这些词。先收藏好：忘了就回到这一节来看。（HTTP、cookie/session、header的术语前面已经解释过了。）

- **API** 是通过代码（而不是界面）与服务器通信的"入口"。通常返回 JSON。它的每个 URL/操作都是一个 **endpoint**（例如：`GET /api/v1/usuarios/1001`）。
    
- **Endpoint**：应用/API 中接受请求的一个具体路径（例如：`/login`、`/api/faturas`）。
    
- **Payload** 是你发送的"内容"。可以是一个请求的正文，或者在攻击中，是你注入的恶意字符串（例如：一个 XSS payload）。
    
- **Token**：登录后用来证明你身份的一种凭据，每次请求时都会发送（通常放在 `Authorization: Bearer ...` 头里）。它取代了每次都要发送密码的做法。
    
- **JWT（JSON Web Token）** 是最常见的 token 类型。它由三部分组成，用点号分隔（header.payload.signature），每部分都是 Base64URL 编码。payload 携带数据（例如：userId、role），signature 保证没有人篡改过 token。⚠️ Base64 不是加密：你可以在 [jwt.io](https://jwt.io/) 上直接读取 JWT 的内容。深入利用见"账户接管（Account Takeover）"一文。
    
- **Hash × 加密 × 编码**（不要混淆，经常考）：
    
    - **编码**（例如：Base64、URL 编码）：只是改变格式，任何人都可以还原。不提供任何保护。
        
    - **Hash**（例如：SHA-256、bcrypt）：单向过程，无法"反哈希"（但如果哈希较弱，可以通过暴力破解来破解）。
        
    - **加密**（例如：AES）：只有拥有密钥才能还原。这才是真正保护机密性的手段。
        
- **TLS / HTTPS**：用于加密浏览器与服务器之间连接的层（也就是那个小锁标志）。证书用来证明网站身份（这也是为什么在第 2b 步中 Burp 要安装它自己的证书）。
    
- **DNS / 子域名 / CNAME**：DNS 把名称（[alvo.com](https://alvo.com/)）翻译成 IP。子域名是 [loja.alvo.com](https://loja.alvo.com/)。CNAME 是一个"别名"，把一个名称指向另一个名称，是"子域名接管（Subdomain Takeover）"一文的核心。
    
- **同源策略（Same-Origin Policy，SOP）** 是浏览器的规则：默认情况下，一个网站不能读取另一个源（域名+端口+协议）的数据。这是浏览器安全的基础。
    
- **CORS** 是以受控方式放宽同源策略的机制（允许特定来源）。如果配置错误，就会变成漏洞。
    
- **CSP（Content Security Policy）**：一个响应头，告诉浏览器脚本/资源可以从哪些地方加载运行。它是防御 XSS 的主要手段。
    
- **WAF（Web Application Firewall）** 是一个"门卫"，在请求到达应用之前过滤可疑请求。它可以被绕过（在本系列中你会看到多种绕过方式）。
    
- **PoC（Proof of Concept）**：证明漏洞存在的最小证据（用于证明的请求/截图），会写进报告里。
    
- **PII**：个人数据（姓名、CPF、邮箱、地址）。泄露 PII = 高影响。
    
- **CVE / CWE / CVSS**：CVE 是公开已知漏洞的"身份证号"（CVE-AAAA-NNNN）；CWE 是漏洞类别；CVSS 是严重性评分。详见"严重性与影响（Severidade e Impacto）"一文。
    
- **Recon / Fuzzing**：recon 是对目标进行测绘（了解存在什么）；fuzzing 是大量发送尝试来发现路径/参数。详见"Recon 与发现（Recon & Discovery）"一文。
    
- **API / GraphQL / Introspection**：除了 REST，很多应用还使用 GraphQL（一个单一的 `/graphql` URL，接受查询）。Introspection 是 GraphQL 的一个功能，可以列出整个 schema（类型、字段、操作）。当它被启用时，对攻击者来说就是金矿。详见"API 安全（Segurança de APIs）"一文。
    
- **Mass Assignment（批量赋值）**：当你在 JSON 请求中发送额外字段（例如：`"role":"admin"`、`"isAdmin":true`），而应用盲目接受并修改了本不该修改的内容。更多内容见"API 安全"一文。
    
- **SSL Pinning**：移动应用只信任某个特定证书，这会卡住 Burp（Burp 的证书会被拒绝）。可以通过 Frida/objection 做 bypass 来解决。见"移动端漏洞赏金（Bug Bounty em Mobile）"。
    
- **Deeplink** 是一种特殊链接（例如：`app://...`），可以打开移动应用的某个特定页面。校验不严的 deeplink 会成为攻击向量。见"移动端（Mobile）"。
    
- **Cloud metadata**：云环境中的一个内部端点（例如：`http://169.254.169.254`），会返回机器的凭据/配置。它是 SSRF 的经典目标 → 见"SSRF"。
    
- **Primitiva / Chaining**：primitiva 是一个漏洞给你的"能力"（读文件、重定向、发起服务端请求……）。Chaining 是把多个小的原语/漏洞串联起来，直到形成严重影响。"漏洞串联（Chaining de Vulnerabilidades）"一文专门讲这个。
    
- **XXE / 外部实体**：在 XML 中，一个"外部实体"（`<!ENTITY x SYSTEM "file:///...">`）会让解析器去获取一个文件/URL。滥用这一点来读取文件或进行 SSRF，就是 XXE。
    
- **序列化 / Gadget chain**：序列化是把一个对象变成字节/字符串（用于保存或传输）；对不可信数据进行反序列化，可能通过串联应用中已有的类（gadget chain）变成 RCE。见"不安全反序列化（Insecure Deserialization）"。
    
- **Prototype Pollution**：通过 `__proto__` 污染 JavaScript 的 `Object.prototype`，从而影响应用中的所有对象。见"原型污染（Prototype Pollution）"。
    
- **S3 / IAM / IMDS**：AWS 云相关术语——S3（bucket 存储）、IAM（身份与权限）、IMDS（metadata 端点 169.254.169.254，可能返回凭据）。见"云与 AWS（Cloud & AWS）"。

## 总结

- 网络由**客户端↔服务器↔数据库组成**，通过**HTTP协议**进行通信。客户端发送的所有内容都是**可控的**，而将其视为完全可信则是大多数故障的根源。
- **身份验证**= "你是谁？"；**授权**= "你能做什么？"。不要混淆它们：这是最赚钱的漏洞的基础。
- OWASP **Top 10 2021**是你的路线图；**A01（访问控制失效）**和**A03（注入攻击）**是入门之选。
- 漏洞赏金是**合法的漏洞挖掘**：阅读范围和规则，使用最小的概念验证，并负责任地披露信息。
- **Burp Suite**就像放大镜：代理拦截、中继器测试、入侵者自动化。

# what a 控制访问错误

> [!node] 概念
> **访问控制**是一组规则，用于决定_谁可以执行哪些操作_。身份验证回答"**你是谁？** "；授权回答"**你能执行此操作吗？** "。当应用程序**在授权过程中出错**时，就会出现访问控制失效的情况：它知道你是谁，但忘记检查你是否_有权_访问该资源或执行该功能。

就像前文提到的例子，你可以访问任意的东西，只需要改变参数即可

|缩写|名称|攻击者会做什么|
|---|---|---|
|IDOR|Insecure Direct Object Reference（不安全直接对象引用）|更换某个对象的标识符（id、cpf、chargeId），访问其他用户的数据|
|BOLA|Broken Object Level Authorization（对象级授权失效）|与 IDOR 概念相同，但这是 API 领域的官方术语（在 OWASP API Top 10 中排名第 1）|
|BFLA|Broken Function Level Authorization（功能级授权失效）|访问某个本应只属于其他角色的功能/操作（例如：普通用户执行管理员操作）|
总结一下最容易混淆的区别：

- IDOR/BOLA = 对某个对象/数据的不当访问（"我能看到别人的账单"）。
    
- BFLA = 对某个功能的不当访问（"我以普通用户身份执行管理员操作"）。

## 重要性

这个涉及一些保密的问题，导致他是目前是最简单也是回报最高的一类漏洞

他会导致一下问题
- 信息的泄密问题
- 账户的接管问题
- 特权操作

## 原理

> [!node] 笔记
> 其实是很简单了，就如同在赏金猎人文章里面写的，一个程序他是需要有客户端，服务端，数据库的，而这里是需要注意，在开发一个程序过程中，需要去判断他是不是当前用户，他有没有换人。



```http
GET /api/pedidos?id=1001 HTTP/2
Host: alvo.com
Authorization: Bearer eyJhbGciOi...   # <- 这个时候他会认为你是用户b
```

```sql
// 后端直接返回了数据
$pedido = $db->query("SELECT * FROM pedidos WHERE id = " . $_GET['id']);
return json($pedido);   // 他没有验证你是不是用户b
```

> **Token /`Authorization: Bearer`**：用于在每次请求中证明您身份的凭证（没有它，您就无法"登录"）。它通常是**JWT**（`header.payload.signature`Base64URL 格式）。详情请参阅术语表。



# 可能出现的情况

- **基于连续数字 ID 的 IDOR**：经典情况，`?id=1001` → `?id=1002`。
    
- **业务参数中的 IDOR**：标识符不是明显的 id，而是类似 `?cpf=`、`?NroConta=`、`?chargeId=`、`?id_subgrupo=`。
    
- **请求体（POST/PUT）或 Header 中的 IDOR**：标识符放在 JSON 或自定义 Header 里，而不是 URL 中。
    
- **通过账号间 token 互换实现的 IDOR**：你保持自己的访问权限，但使用另一个角色才能访问的端点，只替换授权 token（常见于报表下载场景）。
    
- **"伪装"的 IDOR**：ID 是 UUID/哈希/加密值。有时 API 本身会返回某个参数加密后的值，这样就可以复用它。
    
- **BFLA**：特权功能对应的端点存在且会响应，只是本不应该接受你当前的角色。

## 深入

### 一级：枚举 URL 中的 ID（GET）

```http
GET /api/faturas/charge-details?chargeId=10051002 HTTP/2   # 原请求
GET /api/faturas/charge-details?chargeId=10051001 HTTP/2   # 修改后的请求
```

如果它返回的值不是你的值 → IDOR 已确认。为了展示**规模**，请使用**Burp Intruder**并携带数值有效载荷（有效载荷是 Burp 自动注入的值列表；`Sniper`它是每次改变一个位置的模式，这里是`chargeId`），看看有多少 ID 会返回 200 个不同的数据。

### 二级：体内识别/非显性方法

简单来说就是，要改动的数值不是在GET的后面了，而是在每个请求包的下面


```http
PUT /api/usuario HTTP/2
Host: alvo.com
Content-Type: application/json
Authorization: Bearer <token_da_Conta_B>

{"userId": 1001, "telefone": "11999999999"}   # <- 在除了GET方法以外剩下的很多的东西都是存放在这里的
```

你可以像在GET方法中一样进行修改就行

### 三级：令牌交换

> [!node] 概念
> 他是将一个不可以使用某个权利的账号的令牌（Authorization），换给可以使用这个权利的账号的令牌，但是这个账号可以使用这个权利。

>[!example] 例子
>校长用学生的身份，开除了学生。

当然，这个可能是一个很地狱的笑话，但是他在**日常的测试**中可能会真实的碰到，导致出现了这个问题。如果之后工作的时候可以试试这个东西，当然如果你自己测试的话，需要注意，不要做不利于自己的事情

### 四级：BFLA

> [!ndoe] 作者的小提问
> 还记得BFLA是什么吗？
> 他是说明一个特权可以被其他人使用的情况


```http
POST /api/admin/store/block HTTP/2
Authorization: Bearer <token_do_usuario_comum>   # <- 没有权限的角色（普通用户 token）
{"storeId": 77}
```

这个的测试就比较有意思了，在第三级的时候是将一个有该权限的人的令牌给换成了没有该权限的人的令牌，而这个是直接用他们**各自的令牌**来进行测试，看看普通用户是否可以使用某些核心功能

### 五级："受身份保护"的标识

到了这一级就是IDOR的变种了，会相较于前面的哪几种会**难**很多，但是不要紧，跟着我的思路

#### UUID / Hash类型的ID

> [!node] 注意
> 开发者认为只要我把很多的东西变成不可预测的那种，那么我就不会被攻击，这个是一个**很严重的一个错误**
> 身为猎人，我是无法通过枚举（猜测）来实现类似于第一二种的那个东西
> 但是他忽略了另外一个东西---**越权**，我可以用其他人的UUID来进行

#### API 返回的加密/签名值重用

简单来说，他还是延续了上面的那个理念，反正就是不让你猜到某些东西，但是为了拿到赏金，你需要去看看有没有什么方法可以拿到什么东西。（这个就不做过多的讲解，需要自己参悟了）

> [!example] 例子
> 用户A请求了一个东西返回了一个数据，但是这个是加密的
> 用户B使用了这个数据，并把它放到了其他的接口（请求的地方）中
> 如果服务端那边没有认证你这个人的话，那么用户B就可以看到用户A的很多的东西了

#### 通过密码重置/刷新流程实现账户接管（ATO）

> [!node] 知识点
> IDOR 不仅可以用来读取数据，还可以用在**关键业务流程**中，比如密码重置、刷新令牌、修改绑定邮箱等。如果在这些流程中，用户标识符（如 `login`、`email`、`userId`）可以被替换，攻击者就能劫持另一个账户。

```http
POST /autenticacao/api/v1/alterar-senha HTTP/2
{"usuario": "vitima_alvo", "novaSenha": "Senha123!", "confirmaSenha": "Senha123!"}
# <- "usuario" 本应在会话中固定；如果接受其他用户，就是账户接管（ATO）
```

对于这个漏洞，你可能会将对方的用户邮箱或者其他可能可以证明他身份的东西替换成你自己，这样就会

更加详细的一个讲解：[[账户接管（ATO）：接管任何账户]]
# 防御

> [!node] 措施
> 为什么会出现这么多的一个问题，最简单的原因就是，服务端并没有验证一些东西导致的
> 而任何解决这个问题呢，仅仅需要让**服务端**可以**识别**这个到底是不是**你这个人发布并且使用**的就可以了，不能出现**张冠李戴**的情况了

## 检查用户的所有权
```js
// 错误 —— 信任客户端传来的 id  
`$pedido = Pedido::find($_GET['id']);`  
// 正确 —— 只有对象属于当前登录用户时才返回  
`$pedido = Pedido::where('id', $req->id)->where('dono_id', auth()->id())->firstOrFail();`
```

```js
// 两者匹配才能给出对应的东西，否则返回404
const pedido = await Pedido.findOne({ _id: req.params.id, donoId: req.user.id });
if (!pedido) return res.sendStatus(404);
```

## 授权

```python
@permission_classes([IsAdminUser])
def block_store(request): ...
```

> [!danger] 警告
> 要时刻谨记前端送过来的东西一个都不能信，信了就完了，永远需要在后端才重新过一遍才可以，确定好了才能执行

## 原则

- **默认拒绝**：除非明确允许，否则所有操作均被拒绝。
- **不要依赖客户端的任何信息**来决定授权（例如，错误的客户端 JWT 中的 ID、角色、标志等）。
- **不可预测的 ID**（UUID v4）有助于防止枚举，但**不能取代**所有者检查。
- **登录并报告**被拒绝/异常的访问（枚举会产生很多 403/404 错误）。
- **CI 中的授权测试**：对于每个端点，测试"帐户 B 无法访问帐户 A 对象"。

<script type="text/markdown" id="article-security-ato">
# 基础

> [!node] 概念
> 商标攻击（ATO）并非单一漏洞，而是一种**结果**。多种不同的缺陷最终导致同一结果：攻击者开始像受害者一样行事。其共同点在于**身份验证**或**会话/身份管理方面**的漏洞。

> [!example] 例子
> 你可以想象一下，你原本有你的账号，但是你突然可以使用别人的账号，换句话来说，你在学校是一个学生，但是你通过ATO你掌握了校长的账号，那个时候，岂不是可以为所欲为了吗？

# 重要性

因为你是直接使用了别人的东西导致的，而这个东西你原本是无法使用的

ATO（账户接管）的影响是最直接的，不需要链式利用也不需要想象：

- 完全访问受害者账户：读取PII（姓名、CPF、电话、地址）、历史记录、消息。  
- 锁定：一旦更改了受害者的密码，你就将其踢出了自己的账户（对她造成拒绝服务）。  
- 规模：如果攻击向量是可伪造的JWT，或者是一个接受任意用户的密码重置，那你接管的不是一个账户，而是任意一个账户。这会把严重性从"高"提升到"严重"。  
- 支点：接管管理员账户会打开BFLA、内部面板访问权限等。ATO同时也是多条利用链的终点：窃取JWT的XSS、泄露OAuth code的开放重定向（参见漏洞链式利用）。

# 原理

1. **凭证创建/恢复，***密码重置**流程。如果重置令牌是可预测的、不会过期的，或者**重置目标**可由客户端控制，则会发出 ATO（可接受交易行为）。
2. **令牌颁发**：登录、**令牌刷新**、令牌交换。如果应用程序使用可控数据（来自其他帐户的电子邮件/令牌）颁发会话令牌，则会触发 ATO（操作违规）。
3. **令牌验证**，例如**JWT**。如果签名未得到真正验证（alg=none、密钥弱、算法混乱），你可以伪造任何人的令牌。
4. **联合身份验证/第二因素**：**OAuth**和**2FA/OTP**。如果缺少此验证方式`state`、`redirect_uri`代码泄露、OTP 没有速率限制，或者验证在客户端进行，则会绕过额外的因素。

> 其实他们的原理很好理解，就是看对方到底是怎么来运行的，返回的数据有哪些是我可以来使用的，我该怎么来使用这些数据，服务端会不会核验这些数据

<script type="text/markdown" id="article-essay-why-writing">
我以前觉得，写东西给别人看，是需要"准备好了"才能做的事。

但现在我越来越觉得，
**写下来首先是为了自己**。

---

上周我想回忆之前学过的某个 Kotlin 协程细节，
翻遍了收藏夹、印象笔记、本地 markdown，
最后在一个临时起的 `notes.md` 里找到了答案 ——
就两行，三个月前随手记的。

那种感觉很难形容。
像是和一个过去的自己对话，
他给你递了张纸条：

> 你之前踩过这个坑，记得别再绕了。

---

所以我决定开这个博客。

不为流量，不为涨粉。
**只为自己的脑子做减法。**

> "对抗遗忘最好的方式，是写下来。"

## 我打算怎么写

- **技术笔记**：学到了什么、踩了什么坑、怎么解决
- **项目开发记录**：过程、复盘、TODO
- **项目分享**：做的东西、为什么做、怎么用
- **杂谈随笔**：想到什么写什么，不强求成文

## 长期打算

这个博客不是"项目"，是"花园"。
我打算慢慢养，不急着种、不急着收。

有些文章可能写一半就停了，
有些可能写了又删，
有些可能隔几个月回来更新一遍。

**这就是数字花园的玩法。**

## 项目简介

这是我的个人数字花园 / 个人 IP 站点。

**目标**：

- 把学到的技术记下来
- 把做过的项目沉淀下来
- 把碎片想法写出来，避免遗忘
- 长期维护，慢慢养

**用户**：主要是未来的自己，其次是少数路过的人。

## 技术栈

- **静态生成器**：Hugo extended
- **主题**：hugo-theme-stack（魔改）
- **部署**：GitHub Pages
- **CI/CD**：GitHub Actions
- **样式**：手写 SCSS / CSS（深色全屏极客风）
- **写作用工具**：本地 Markdown，git 提交

```
blog/
├── content/

function highlightCode(code, lang){
  // Escape HTML
  code = escapeHtml(code);
  var stash = [];
  function ph(html){ stash.push(html); return '\x00'+(stash.length-1)+'\x00'; }
  
  // 1. Strings first (stash to protect // and # inside strings)
  code = code.replace(/"(?:[^"\\]|\\.)*"/g, function(m){ return ph('<span class="tok-string">'+m+'</span>'); });
  code = code.replace(/'(?:[^'\\]|\\.)*'/g, function(m){ return ph('<span class="tok-string">'+m+'</span>'); });
  code = code.replace(/`(?:[^`\\]|\\.)*`/g, function(m){ return ph('<span class="tok-string">'+m+'</span>'); });
  
  // 2. Block comments
  code = code.replace(/\/\*[\s\S]*?\*\//g, function(m){ return ph('<span class="tok-comment">'+m+'</span>'); });
  
  // 3. Line comments - use lookbehind to skip :// in URLs
  code = code.replace(/(?<!:)\/\/[^\n]*/g, function(m){ return ph('<span class="tok-comment">'+m+'</span>'); });
  
  // 4. Hash comments (yaml, bash, python, http) - match # at line start or after whitespace
  if(lang==='yaml'||lang==='bash'||lang==='python'||lang===''||lang==='http'){
    code = code.replace(/(^|\s)(#[^\n]*)/g, function(m, p1, p2){ return p1+ph('<span class="tok-comment">'+p2+'</span>'); });
  }
  
  // 3. Keywords
  var kws = kwSets[lang] || kwSets['js'];
  if(kws && kws.length){
    var kwRe = new RegExp('\\b('+kws.join('|')+')\\b', 'g');
    code = code.replace(kwRe, function(m){ return ph('<span class="tok-keyword">'+m+'</span>'); });
  }
  
  // 4. Numbers
  code = code.replace(/\b(\d+\.?\d*)\b/g, function(m){ return ph('<span class="tok-number">'+m+'</span>'); });
  
  // 5. Function calls (word followed by paren)
  code = code.replace(/\b([a-zA-Z_$][\w$]*)(\s*\()/g, function(m, name, paren){
    // Don't re-highlight if already in stash
    if(name.indexOf('\x00')!==-1) return m;
    return ph('<span class="tok-function">'+name+'</span>')+paren;
  });
  
  // 6. Restore stash
  code = code.replace(/\x00(\d+)\x00/g, function(m, i){ return stash[parseInt(i)]; });
  
  return code;
}

// ===== Inline Processor =====
function processInline(text){
  // 1. Extract inline code
  var codeSpans = [];
  text = text.replace(/`([^`]+)`/g, function(m, c){
    codeSpans.push(c);
    return '\x01CS'+(codeSpans.length-1)+'\x01';
  });
  
  // 2. Escape HTML
  text = escapeHtml(text);
  
  // 3. Obsidian image embeds ![[...]]
  text = text.replace(/!\[\[([^\]]+)\]\]/g, function(m, name){
    return '<span class="obsidian-embed">&#128247; '+escapeHtml(name)+'</span>';
  });
  
  // 4. Wiki links [[...]]
  text = text.replace(/\[\[([^\]]+)\]\]/g, function(m, content){
    return '<span class="wiki-link">'+content+'</span>';
  });
  
  // 5. Links [text](url) - handle before other bracket processing
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, label, url){
    var u = url.trim();
    if(u.charAt(0)==='#'){
      return '<a href="'+u+'" class="internal-link" data-route="'+u+'">'+label+'</a>';
    }
    return '<a href="'+u+'" target="_blank" rel="noopener">'+label+'</a>';
  });
  
  // 6. Highlights ==text==
  text = text.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  
  // 7. Bold **text**
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  
  // 8. Italic _text_ (not between alphanumerics)
  text = text.replace(/(?<![a-zA-Z0-9])_([^_\n]+)_(?![a-zA-Z0-9])/g, '<em>$1</em>');
  
  // 9. Italic *text* (not part of bold)
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  
  // 10. Restore code spans
  text = text.replace(/\x01CS(\d+)\x01/g, function(m, i){
    return '<code>'+escapeHtml(codeSpans[parseInt(i)])+'</code>';
  });
  
  return text;
}

// ===== Table Renderer =====
function renderTable(lines){
  var headers = lines[0].split('|').slice(1,-1).map(function(s){return s.trim();});
  var rows = lines.slice(2).filter(function(l){return l.trim();}).map(function(line){
    return line.split('|').slice(1,-1).map(function(s){return s.trim();});
  });
  var html = '<div class="table-wrapper"><table><thead><tr>';
  headers.forEach(function(h){ html += '<th>'+processInline(h)+'</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(row){
    html += '<tr>';
    row.forEach(function(cell){ html += '<td>'+processInline(cell)+'</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

// ===== List Renderer =====
function renderList(lines, ordered){
  var tag = ordered ? 'ol' : 'ul';
  var html = '<'+tag+'>';
  lines.forEach(function(line){
    var content, isTask = false, checked = false;
    // Task list item
    var taskMatch = line.match(/^[-*+]\s+\[([ xX])\]\s+(.+)$/);
    if(taskMatch){
      isTask = true;
      checked = taskMatch[1].toLowerCase()==='x';
      content = taskMatch[2];
    } else if(ordered){
      content = line.replace(/^\d+\.\s+/, '');
    } else {
      content = line.replace(/^[-*+]\s+/, '');
    }
    if(isTask){
      html += '<li class="task-list-item"><input type="checkbox" disabled'+(checked?' checked':'')+'>'+processInline(content)+'</li>';
    } else {
      html += '<li>'+processInline(content)+'</li>';
    }
  });
  html += '</'+tag+'>';
  return html;
}

// ===== Callout type normalization =====
function normalizeCalloutType(t){
  t = t.toLowerCase();
  if(t==='node'||t==='ndoe'||t==='note') return 'node';
  if(t==='danger'||t==='warning') return t;
  if(t==='example'||t==='tip'||t==='info') return t;
  return 'info';
}

// ===== Markdown Renderer =====
function renderMarkdown(md){
  if(!md) return '';
  md = md.replace(/^\s*\n/,'').replace(/\s+$/,'');
  
  // 1. Extract code blocks
  var codeBlocks = [];
  md = md.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
    codeBlocks.push({lang:lang||'', code:code});
    return '\n\x02CB'+(codeBlocks.length-1)+'\x02\n';
  });
  
  var lines = md.split('\n');
  var result = [];
  var i = 0;
  
  while(i < lines.length){
    var line = lines[i];
    
    // Empty
    if(/^\s*$/.test(line)){ i++; continue; }
    
    // Code block placeholder
    var cbMatch = line.match(/^\s*\x02CB(\d+)\x02\s*$/);
    if(cbMatch){
      var idx = parseInt(cbMatch[1]);
      var block = codeBlocks[idx];
      result.push('<pre class="code-block"><code class="language-'+escapeHtml(block.lang)+'">'+highlightCode(block.code, block.lang)+'\n</code></pre>');
      i++;
      continue;
    }
    
    // Heading (require space after #)
    var hMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if(hMatch){
      var level = hMatch[1].length;
      result.push('<h'+level+'>'+processInline(hMatch[2])+'</h'+level+'>');
      i++;
      continue;
    }
    
    // Horizontal rule
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      result.push('<hr>');
      i++;
      continue;
    }
    
    // Obsidian tag (#word without space)
    if(/^#\S+$/.test(line.trim())){
      result.push('<p><span class="obsidian-tag">'+escapeHtml(line.trim().slice(1))+'</span></p>');
      i++;
      continue;
    }
    
    // Blockquote / Callout
    if(/^>/.test(line)){
      var bqLines = [];
      while(i < lines.length && /^>/.test(lines[i])){
        bqLines.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      // Check callout
      var calloutMatch = bqLines[0] && bqLines[0].match(/^\[!(\w+)\]\s*(.*)$/);
      if(calloutMatch){
        var cType = normalizeCalloutType(calloutMatch[1]);
        var cTitle = calloutMatch[2] || calloutMatch[1];
        var cBody = bqLines.slice(1).join('\n').replace(/^\s*$/,'');
        var bodyHtml = cBody ? renderMarkdown(cBody) : '';
        result.push('<div class="callout callout-'+cType+'"><div class="callout-title">'+escapeHtml(cTitle)+'</div><div class="callout-body">'+bodyHtml+'</div></div>');
      } else {
        var content = bqLines.join('\n');
        // Process content as markdown (for paragraphs, lists, etc.)
        var bqHtml = renderMarkdown(content);
        result.push('<blockquote>'+bqHtml+'</blockquote>');
      }
      continue;
    }
    
    // Table
    if(/^\|.*\|/.test(line) && i+1 < lines.length && /^\|[\s\-:]+\|/.test(lines[i+1])){
      var tableLines = [];
      while(i < lines.length && /^\|.*\|/.test(lines[i])){
        tableLines.push(lines[i]);
        i++;
      }
      result.push(renderTable(tableLines));
      continue;
    }
    
    // Unordered list / Task list
    if(/^[-*+]\s/.test(line)){
      var ulLines = [];
      while(i < lines.length && /^[-*+]\s/.test(lines[i])){
        ulLines.push(lines[i]);
        i++;
      }
      result.push(renderList(ulLines, false));
      continue;
    }
    
    // Ordered list
    if(/^\d+\.\s/.test(line)){
      var olLines = [];
      while(i < lines.length && /^\d+\.\s/.test(lines[i])){
        olLines.push(lines[i]);
        i++;
      }
      result.push(renderList(olLines, true));
      continue;
    }
    
    // Paragraph (collect consecutive non-special lines)
    var paraLines = [];
    while(i < lines.length){
      var l = lines[i];
      if(/^\s*$/.test(l)) break;
      if(/^#{1,4}\s/.test(l)) break;
      if(/^>/.test(l)) break;
      if(/^\|.*\|/.test(l)) break;
      if(/^[-*+]\s/.test(l)) break;
      if(/^\d+\.\s/.test(l)) break;
      if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) break;
      if(/^\s*\x02CB\d+\x02/.test(l)) break;
      if(/^#\S+$/.test(l.trim())) break;
      paraLines.push(l);
      i++;
    }
    if(paraLines.length){
      result.push('<p>'+paraLines.map(function(l){return processInline(l);}).join('<br>')+'</p>');
    }
  }
  
  return result.join('\n');
}

// ===== Sidebar Builder =====
function buildSidebar(){
  var nav = document.getElementById('sidebarNav');
  var html = '';
  navData.forEach(function(entry){
    if(entry.type === 'item'){
      html += '<div class="nav-item" data-id="'+entry.id+'" data-title="'+escapeHtml(entry.title)+'">';
      html += '<span class="nav-icon">'+entry.icon+'</span>'+escapeHtml(entry.title)+'</div>';
    } else if(entry.type === 'category'){
      var catId = 'cat-' + entry.title.replace(/\s+/g,'-');
      html += '<div class="nav-category" data-cat="'+catId+'"><span class="chevron">&#9660;</span>'+escapeHtml(entry.title)+'</div>';
      html += '<div class="nav-children" id="'+catId+'">';
      entry.items.forEach(function(item){
        html += '<div class="nav-item" data-id="'+item.id+'" data-title="'+escapeHtml(item.title)+'">'+escapeHtml(item.title)+'</div>';
      });
      html += '</div>';
    }
  });
  nav.innerHTML = html;
}

// ===== Route Handler =====
var currentArticle = null;

function loadArticle(id){
  var content = document.getElementById('content');
  
  // Scroll to top
  window.scrollTo(0, 0);
  
  // Update active state
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-id') === id);
  });
  
  // Expand the category containing this item
  document.querySelectorAll('.nav-children').forEach(function(el){ el.classList.remove('collapsed'); });
  document.querySelectorAll('.nav-category').forEach(function(el){ el.classList.remove('collapsed'); });
  var activeItem = document.querySelector('.nav-item[data-id="'+id+'"]');
  if(activeItem){
    var parent = activeItem.parentElement;
    if(parent && parent.classList.contains('nav-children')){
      parent.classList.remove('collapsed');
      var cat = document.querySelector('.nav-category[data-cat="'+parent.id+'"]');
      if(cat) cat.classList.remove('collapsed');
    }
  }
  
  if(id === 'home'){
    content.innerHTML = renderHome();
    currentArticle = 'home';
    bindInternalLinks();
    return;
  }
  
  var script = document.getElementById('article-' + id);
  if(script){
    var md = script.textContent || '';
    // Trim leading/trailing whitespace
    md = md.replace(/^\n+/, '').replace(/\s+$/, '');
    content.innerHTML = renderMarkdown(md);
    currentArticle = id;
    bindInternalLinks();
  } else {
    content.innerHTML = '<h1>404</h1><p>文章未找到。</p>';
  }
  
  // Close sidebar on mobile
  if(window.innerWidth <= 768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
}

function bindInternalLinks(){
  document.querySelectorAll('.internal-link').forEach(function(link){
    link.addEventListener('click', function(e){
      e.preventDefault();
      var route = link.getAttribute('data-route') || link.getAttribute('href');
      if(route){
        window.location.hash = route;
      }
    });
  });
}

function handleRoute(){
  var hash = window.location.hash || '#/home';
  var id = hash.replace(/^#\//, '');
  if(!id) id = 'home';
  loadArticle(id);
}

// ===== Search =====
function setupSearch(){
  var searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    var items = document.querySelectorAll('.nav-item');
    if(!q){
      // Show all, restore default state
      items.forEach(function(el){ el.style.display=''; });
      document.querySelectorAll('.nav-children').forEach(function(el){ el.classList.remove('collapsed'); });
      document.querySelectorAll('.nav-category').forEach(function(el){ el.classList.remove('collapsed'); });
      return;
    }
    var matchedCats = {};
    items.forEach(function(el){
      var title = (el.getAttribute('data-title')||'').toLowerCase();
      var id = el.getAttribute('data-id')||'';
      var match = title.indexOf(q) !== -1 || id.indexOf(q) !== -1;
      el.style.display = match ? '' : 'none';
      if(match){
        var parent = el.parentElement;
        if(parent && parent.classList.contains('nav-children')){
          parent.classList.remove('collapsed');
          matchedCats[parent.id] = true;
        }
      }
    });
    // Collapse categories with no matches
    document.querySelectorAll('.nav-category').forEach(function(el){
      var catId = el.getAttribute('data-cat');
      if(matchedCats[catId]){
        el.classList.remove('collapsed');
        el.style.display = '';
      } else {
        el.style.display = 'none';
      }
    });
  });
}

// ===== Sidebar Categories =====
function setupCategories(){
  document.querySelectorAll('.nav-category').forEach(function(cat){
    cat.addEventListener('click', function(){
      var catId = cat.getAttribute('data-cat');
      var children = document.getElementById(catId);
      if(children){
        children.classList.toggle('collapsed');
        cat.classList.toggle('collapsed');
      }
    });
  });
}

// ===== Navigation Clicks =====
function setupNavClicks(){
  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      var id = item.getAttribute('data-id');
      if(id){
        window.location.hash = '#/' + id;
      }
    });
  });
}

// ===== Mobile Menu =====
function setupMobileMenu(){
  var toggle = document.getElementById('menuToggle');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  toggle.addEventListener('click', function(){
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', function(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
}

// ===== Init =====
function init(){
  buildSidebar();
  setupNavClicks();
  setupCategories();
  setupSearch();
  setupMobileMenu();
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
